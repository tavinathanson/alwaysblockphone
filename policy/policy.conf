# AlwaysBlockPhone policy: one rule per line. This file is a generic example.
#
# For your own rules, copy this file to policy/local.conf (gitignored).
# When local.conf exists, the app and bin/verify use it instead of this file.
# Rules are built into the app, so changing them means rebuilding and
# reinstalling. That is deliberate friction against impulsive edits.
#
# Columns: id  access  package  [wait  duration  cooldown]
#   access:   normal | friction | absent | undecided
#   friction: wait, duration and cooldown are required, in minutes
#             (decimals allowed, duration must be above zero)
#
# id          access      package                       wait  duration  cooldown
signal        normal      org.thoughtcrime.securesms
instagram     friction    com.instagram.android         5     20        30
chrome        friction    com.android.chrome            5     15        30
youtube       absent      com.google.android.youtube
